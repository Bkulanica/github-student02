
name: Demo Secret

on:
  workflow_dispatch:

jobs:
  check-secret:
    runs-on: ubuntu-latest

    steps:
      - name: Check secret
        env:
          DEMO_TOKEN: ${{ secrets.DEMO_TOKEN }}
        run: |
          if [ -n "$DEMO_TOKEN" ]; then
            echo "Sekret został poprawnie przekazany."
          else
            echo "Sekret nie jest ustawiony."
            exit 1
          fi
