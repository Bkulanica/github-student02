name: CI

on:
  push:
    branches: [main, "feature-*"]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Pobranie kodu
        uses: actions/checkout@v4

      - name: Konfiguracja Pythona
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalacja zależności
        run: pip install -r requirements.txt

      - name: Testy
        run: pytest -v

      - name: Budowanie obrazu Docker
        run: docker build -t github-student:ci .
